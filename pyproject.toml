[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "subspaceknn"
version = "0.1.0"
description = "Interpretable k-nearest-neighbour classification by ensembling kNN models fitted on low-dimensional feature subspaces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Ribeiro" }]
requires-python = ">=3.10"
keywords = [
  "knn",
  "nearest-neighbours",
  "interpretable-machine-learning",
  "explainability",
  "ensemble",
  "scikit-learn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/subspaceknn"
Repository = "https://github.com/DiogoRibeiro7/subspaceknn"
Issues = "https://github.com/DiogoRibeiro7/subspaceknn/issues"
Changelog = "https://github.com/DiogoRibeiro7/subspaceknn/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "matplotlib>=3.8",
  "mypy>=1.14",
  "pandas>=2.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/subspaceknn"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs/results", "/examples/output"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # trailing commas are handled by the formatter
  "D203",    # one blank line before class docstring conflicts with D211
  "D213",    # multi-line summary on the second line conflicts with D212
  "EM101",   # string literals in exceptions are fine at this size
  "EM102",
  "TRY003",
  "N803",    # X and y are the scikit-learn convention
  "N806",
  "PLR0913", # estimators legitimately take many keyword parameters
  "CPY001",  # no per-file copyright headers; the LICENSE file covers the project
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004", "ANN", "INP001", "SLF001", "FBT003", "T201"]
"examples/**" = ["D", "T201", "INP001", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "mpl_toolkits.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules"
filterwarnings = [
  "error::DeprecationWarning:subspaceknn",
]

[tool.coverage.run]
source = ["subspaceknn"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:"]
